name: CD (Deploy via SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Backend Binary
        run: |
          cd backend
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o api ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Standalone Bundle
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install SSHPass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy Pre-Compiled Artifacts over SSH Stream
        run: |
          mkdir -p ~/.ssh/sockets
          
          # Stream the compressed artifacts directly through standard SSH stdin and extract on server
          # This avoids using the SFTP subsystem (fixing "subsystem request failed on channel 0")
          tar -czf - \
            docker-compose.prod.yml \
            .env.production.example \
            nginx \
            backend/api \
            backend/migrations \
            backend/Dockerfile.prod \
            frontend/.next/standalone \
            frontend/.next/static \
            frontend/public \
            frontend/Dockerfile.prod \
            deploy | sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=no \
              -o ObscureKeystrokeTiming=no \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -o KexAlgorithms=+diffie-hellman-group14-sha1 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=10 \
              -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p ${{ secrets.DEPLOY_PATH }} && tar -xzf - -C ${{ secrets.DEPLOY_PATH }} && cd ${{ secrets.DEPLOY_PATH }} && bash deploy/deploy.sh --prebuilt"
