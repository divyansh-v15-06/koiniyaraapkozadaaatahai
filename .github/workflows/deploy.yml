name: CD (Deploy via SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Backend Binary
        run: |
          cd backend
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o api ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Standalone Bundle
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install SSHPass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Package Artifacts
        run: |
          tar -czf deploy.tar.gz \
            docker-compose.prod.yml \
            .env.production.example \
            nginx \
            backend/api \
            backend/migrations \
            backend/Dockerfile.prod \
            frontend/.next/standalone \
            frontend/.next/static \
            frontend/public \
            frontend/Dockerfile.prod \
            deploy

      - name: Upload Artifacts to Server
        run: |
          # Stream file cleanly into /tmp/deploy.tar.gz on server
          # Direct file redirection (< deploy.tar.gz) guarantees clean EOF without needing SFTP
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /tmp/deploy.tar.gz" < deploy.tar.gz

      - name: Extract & Launch Services
        run: |
          # Execute extract and deploy script in a clean session with stdin closed (-n)
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -n \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.DEPLOY_PATH }} && tar -xzf /tmp/deploy.tar.gz -C ${{ secrets.DEPLOY_PATH }} && rm -f /tmp/deploy.tar.gz && cd ${{ secrets.DEPLOY_PATH }} && SUDO_PASS='${{ secrets.SSH_PASSWORD }}' bash deploy/deploy.sh --prebuilt"


