name: CD (Deploy via SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Run Pre-Deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Validate Backend Build
        run: |
          cd backend
          go vet ./...
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Install SSHPass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Execute Remote Deployment
        run: |
          mkdir -p ~/.ssh/sockets
          
          # Single-line SSH command execution to prevent heredoc escaping and indentation issues
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -o ControlMaster=auto \
            -o ControlPath=~/.ssh/sockets/%r@%h:%p \
            -o ControlPersist=4h \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -c 'if [ ! -d \"${{ secrets.DEPLOY_PATH }}\" ]; then echo \"📥 Initializing repository clone...\"; git clone https://github.com/${{ github.repository }}.git \"${{ secrets.DEPLOY_PATH }}\"; fi && cd \"${{ secrets.DEPLOY_PATH }}\" && echo \"🔄 Updating repository...\" && git fetch origin main && git reset --hard origin/main && echo \"🚀 Launching deployment script...\" && bash deploy/deploy.sh'"
