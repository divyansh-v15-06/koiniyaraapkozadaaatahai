name: CD (Deploy via SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Backend Binary
        run: |
          cd backend
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o api ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Standalone Bundle
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package Build Artifacts
        run: |
          # Package compose setup, configs, prebuilt binary, and standalone frontend bundle
          tar -czf deploy.tar.gz \
            docker-compose.prod.yml \
            nginx \
            backend/api \
            backend/migrations \
            backend/Dockerfile.prod \
            frontend/.next/standalone \
            frontend/.next/static \
            frontend/public \
            frontend/Dockerfile.prod \
            deploy

      - name: Install SSHPass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload and Extract Artifacts on Server
        run: |
          mkdir -p ~/.ssh/sockets
          
          # 1. Create target directory on server if it does not exist
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}"

          # 2. Upload the tarball
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -P ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy.tar.gz

          # 3. Extract and trigger local run
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && tar -xzf deploy.tar.gz && rm -f deploy.tar.gz && bash deploy/deploy.sh --prebuilt"
