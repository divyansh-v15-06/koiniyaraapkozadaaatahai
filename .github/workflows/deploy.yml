name: CD (Deploy via SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Run Pre-Deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Validate Backend Build
        run: |
          cd backend
          go vet ./...
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSHPass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Execute Remote Deployment
        run: |
          mkdir -p ~/.ssh/sockets
          
          # Run deployment commands on the remote server
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o ObscureKeystrokeTiming=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group14-sha1 \
            -o ControlMaster=auto \
            -o ControlPath=~/.ssh/sockets/%r@%h:%p \
            -o ControlPersist=4h \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -s" << 'EOF'
              set -e
              
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/institute-portal' }}"
              REPO_URL="https://github.com/${{ github.repository }}.git"
              
              echo "========================================================="
              echo "🚀 Deploying Institute Portal to Remote Server"
              echo "📁 Target Path: \$DEPLOY_PATH"
              echo "📅 Timestamp: \$(date)"
              echo "========================================================="
              
              # Ensure deployment path exists
              if [ ! -d "\$DEPLOY_PATH/.git" ]; then
                echo "📥 Fresh deployment: Cloning repository..."
                mkdir -p "\$DEPLOY_PATH"
                git clone "\$REPO_URL" "\$DEPLOY_PATH"
                cd "\$DEPLOY_PATH"
              else
                echo "🔄 Updating existing repository..."
                cd "\$DEPLOY_PATH"
                git fetch origin main
                git reset --hard origin/main
              fi
              
              # Ensure production environment file is configured
              if [ ! -f "\$DEPLOY_PATH/.env" ]; then
                echo "⚠️ No .env file found. Creating from .env.production.example..."
                cp "\$DEPLOY_PATH/.env.production.example" "\$DEPLOY_PATH/.env"
              fi
              
              # Pull/Build and Start Docker Containers
              echo "🐳 Starting production containers..."
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
              
              # Check Container Status
              echo "🔍 Checking container health status..."
              sleep 8
              docker compose -f docker-compose.prod.yml ps
              
              # Clean up dangling images and build cache
              echo "🧹 Cleaning up old docker images..."
              docker image prune -f
              
              echo "========================================================="
              echo "🎉 Deployment successfully completed!"
              echo "========================================================="
            EOF
